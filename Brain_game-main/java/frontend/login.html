<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login </title>

    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="page">

        <!-- Header -->
        <div class="brand">
            <h1>BRAIN GAMES</h1>
            <p>Challenge Your Mind</p>
        </div>


        <!-- Login Card -->
        <div class="auth-card">

            <div class="icon">
                🧠
            </div>

            <h2>Welcome Back!</h2>

            <p class="subtitle">
                Login to continue playing
            </p>


            <!-- Login / Signup Tabs -->
            <div class="tabs">

                <button class="active">
                    Login
                </button>

                <button onclick="window.location.href='signup.html'">
                    Sign Up
                </button>

            </div>


            <!-- Login Form -->
            <form>

                <div class="input-group">

                    <label>Email</label>

                    <input
                        type="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Password</label>

                    <input
                        type="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="login-options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>


                <button class="main-btn" type="submit">
                    Login
                </button>

            </form>


            <p class="bottom-text">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>

        </div>

    </div>

</body>

</html>
