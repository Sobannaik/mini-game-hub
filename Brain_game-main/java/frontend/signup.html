
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up </title>

    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="page">

        <!-- Brand -->
        <div class="brand">
            <h1>BRAIN GAMES</h1>
            <p>Challenge Your Mind</p>
        </div>


        <!-- Signup Card -->
        <div class="auth-card">

            <div class="icon">
                🧠
            </div>

            <h2>Create Account</h2>

            <p class="subtitle">
                Join Brain Games and start playing
            </p>


            <!-- Tabs -->
            <div class="tabs">

                <button onclick="window.location.href='login.html'">
                    Login
                </button>

                <button class="active">
                    Sign Up
                </button>

            </div>


            <!-- Signup Form -->
            <form id="signupForm">

                <!-- Name -->
                <div class="input-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="input-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="input-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- Confirm Password -->
                <div class="input-group">

                    <label>Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- Signup Button -->
                <button
                    class="main-btn"
                    type="submit"
                >
                    Create Account
                </button>

            </form>


            <!-- Message -->
            <p id="message"></p>


            <!-- Bottom -->
            <p class="bottom-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="auth.js"></script>

</body>

</html>
