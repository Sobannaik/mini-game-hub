<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Survival Shooter</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
      #unity-container { width: 100% !important; height: 100% !important; position: fixed !important; inset: 0 !important; transform: none !important; left: 0 !important; top: 0 !important; }
      #unity-canvas { width: 100% !important; height: 100% !important; display: block !important; }
      #unity-footer { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.6); z-index: 10; padding: 4px 10px; }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Survival Shooter</div>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/survival-shooter.loader.js";
      var config = {
        dataUrl: "",
        frameworkUrl: buildUrl + "/survival-shooter.framework.js",
        codeUrl: buildUrl + "/survival-shooter.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Survival Shooter",
        productVersion: "0.1",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
        unityShowBanner('WebGL builds are not supported on mobile devices.');
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }
      loadingBar.style.display = "block";

      function fetchPart(url, onProgress) {
        return new Promise(function(resolve, reject) {
          var xhr = new XMLHttpRequest();
          xhr.open("GET", url, true);
          xhr.responseType = "arraybuffer";
          xhr.onprogress = function(e) {
            if (e.lengthComputable && onProgress) {
              onProgress(e.loaded);
            }
          };
          xhr.onload = function() {
            if (xhr.status >= 200 && xhr.status < 300) {
              resolve(xhr.response);
            } else {
              reject(new Error("Failed to load: " + url + " (" + xhr.status + ")"));
            }
          };
          xhr.onerror = function() {
            reject(new Error("Network error loading: " + url));
          };
          xhr.send();
        });
      }

      async function prepareGameData() {
        var partFiles = [
          buildUrl + "/survival-shooter.data.part1",
          buildUrl + "/survival-shooter.data.part2",
          buildUrl + "/survival-shooter.data.part3"
        ];
        var totalBytes = 50929718;
        var loaded = [0, 0, 0];

        function updateProgress() {
          var sum = loaded.reduce(function(a, b) { return a + b; }, 0);
          var pct = Math.min(50, Math.round((sum / totalBytes) * 50));
          progressBarFull.style.width = pct + "%";
        }

        var buffers = await Promise.all(partFiles.map(function(file, index) {
          return fetchPart(file, function(bytes) {
            loaded[index] = bytes;
            updateProgress();
          });
        }));

        var combinedBlob = new Blob(buffers, { type: "application/octet-stream" });
        return URL.createObjectURL(combinedBlob);
      }

      prepareGameData().then(function(blobUrl) {
        config.dataUrl = blobUrl;
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = (50 + Math.round(50 * progress)) + "%";
          }).then((unityInstance) => {
            loadingBar.style.display = "none";
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }).catch((message) => {
            alert(message);
          });
        };
        document.body.appendChild(script);
      }).catch(function(err) {
        unityShowBanner("Failed to load game assets: " + err.message, "error");
      });
    </script>
  </body>
</html>
